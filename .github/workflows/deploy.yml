name: Deploy

# Only pushes to main trigger a deploy.
on:
  push:
    branches: [main]

# A production rollout is one indivisible queue item. Never cancel an older
# migration/API/web sequence in favor of a newer commit, and never interleave
# two schema rollouts.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Same gate as ci.yml (inlined). Must pass before anything deploys.
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turingcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turingcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/turingcare
      BETTER_AUTH_SECRET: ci-only-insecure-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm biome check .
      - name: Typecheck
        run: pnpm -r exec tsc --noEmit
      - name: Apply schema
        run: pnpm --filter @turingcare/api db:migrate
      - name: Test
        run: pnpm -r test
      - name: Build
        run: pnpm -r build
      - name: Build production API image
        run: docker build --file Dockerfile.api --tag turingcare-api:ci .
      - name: Smoke production API image
        run: scripts/smoke-api-image.sh turingcare-api:ci

  # Apply every pending migration through 0013. The locale-aware API requires
  # 0013, while the version constraint in 0014 must wait until legacy read-max
  # Brief generators have drained.
  migrate-compatible:
    needs: ci
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate production database through the compatible schema
        run: pnpm --filter @turingcare/api db:migrate:predeploy

  # `flyctl deploy` does not return successfully until the rolling replacement
  # completes. After this job, every serving machine uses the dog-locking Brief
  # generator and no legacy writer can resume after 0014 is installed.
  deploy-api:
    needs: migrate-compatible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --strategy rolling --config apps/api/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Apply 0014 only after all production API machines use the dog-locking
  # Brief generator. The predeploy command fails closed if 0014 is not last,
  # forcing future releases to choose and test their own migration phase.
  migrate:
    needs: deploy-api
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate production database
        run: pnpm --filter @turingcare/api db:migrate

  # The locale-aware frontend requires the compatible API and schema. Publish
  # it only after the API rollout and every migration complete successfully.
  deploy-web:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (prod API URL)
        run: pnpm --filter @turingcare/web build
        env:
          VITE_API_URL: https://api.turingcare.dog
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=turingcare-web --branch=main
