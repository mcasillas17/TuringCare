name: Deploy

# Only pushes to main trigger a deploy.
on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Same gate as ci.yml (inlined). Must pass before anything deploys.
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turingcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turingcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/turingcare
      BETTER_AUTH_SECRET: ci-only-insecure-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm biome check .
      - name: Typecheck
        run: pnpm -r exec tsc --noEmit
      - name: Apply schema
        run: pnpm --filter @turingcare/api db:migrate
      - name: Test
        run: pnpm -r test
      - name: Build
        run: pnpm -r build

  migrate:
    needs: ci
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: pnpm install --frozen-lockfile
      - name: Drain old API and migrate
        run: |
          set -Eeuo pipefail
          original_count=$(flyctl machine list --json --app turingcare-api | jq 'length')
          restore_old_release() {
            flyctl scale count "$original_count" --yes --app turingcare-api
            if [ "$original_count" -gt 0 ]; then
              curl --fail --retry 12 --retry-delay 5 --retry-all-errors https://api.turingcare.dog/health
            fi
          }
          restore_on_exit() {
            status=$?
            trap - EXIT INT TERM
            restore_old_release
            exit "$status"
          }
          trap restore_on_exit EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          flyctl scale count 0 --yes --app turingcare-api
          for attempt in $(seq 1 12); do
            count=$(flyctl machine list --json --app turingcare-api | jq 'length')
            if [ "$count" -eq 0 ]; then
              break
            fi
            sleep 5
          done
          remaining=$(flyctl machine list --json --app turingcare-api | jq 'length')
          if [ "$remaining" -ne 0 ]; then
            echo "API machines did not drain" >&2
            exit 1
          fi
          pnpm --filter @turingcare/api db:migrate
          trap - EXIT INT TERM

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy and verify compatible API
        run: |
          set -Eeuo pipefail
          drain_on_exit() {
            status=$?
            trap - EXIT INT TERM
            flyctl scale count 0 --yes --app turingcare-api
            exit "$status"
          }
          trap drain_on_exit EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          flyctl deploy --remote-only --config apps/api/fly.toml
          flyctl scale count 1 --yes --app turingcare-api
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors https://api.turingcare.dog/ready
          trap - EXIT INT TERM
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # The web uses the expanded focus/session contracts, so publish it only after
  # the migrated API is healthy.
  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (prod API URL)
        run: pnpm --filter @turingcare/web build
        env:
          VITE_API_URL: https://api.turingcare.dog
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=turingcare-web --branch=main
