# fly.toml for turingcare-api (TuringCare API on Fly.io)
# Deployed by .github/workflows/deploy.yml: flyctl deploy --remote-only --config apps/api/fly.toml

app = 'turingcare-api'
primary_region = 'iad'   # co-located with Supabase us-east-1

[build]
  # pnpm monorepo build; context is the repo root.
  dockerfile = '../../Dockerfile.api'

[env]
  PORT = '3001'

[http_service]
  internal_port = 3001   # must equal PORT (the app binds env.PORT)
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
