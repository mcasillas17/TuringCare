services:
  postgres:
    image: postgres:16
    container_name: turingcare-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: turingcare
    ports:
      - "5432:5432"
    volumes:
      - turingcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turingcare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  turingcare_pgdata:
